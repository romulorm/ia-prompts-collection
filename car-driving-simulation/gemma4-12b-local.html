<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Drive - Side View</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="driveCanvas"></canvas>

<script>
/**
 * Cinematic Side-View Drive Simulation
 * A self-contained canvas animation using parallax layers, 
 * procedural scenery, and a simulated sports car.
 */

const canvas = document.getElementById('driveCanvas');
const ctx = canvas.getContext('2d');

let width, height;
let frame = 0;

// Configuration
const COLORS = {
    skyTop: '#1a1c2c',
    skyBottom: '#4a5568',
    sun: '#ff9e7d',
    mountain: '#2d3748',
    hill: '#1a202c',
    road: '#2d3748',
    grass: '#1a3a3a',
    carBody: '#e53e3e', // Red Sports Car
    carTrim: '#1a202c'
};

// Layers for parallax (speed multipliers)
const layers = [
    { name: 'mountains', speed: 0.2, color: COLORS.mountain, type: 'jagged' },
    { name: 'far_trees', speed: 0.5, color: '#2d3748', type: 'tree', density: 15 },
    { name: 'poles', speed: 1.2, color: '#4a5568', type: 'pole' },
    { name: 'roadside', speed: 2.0, color: '#3d5a80', type: 'bush' }
];

let objects = [];

function init() {
    resize();
    // Generate initial background elements
    layers.forEach(layer => {
        const count = layer.type === 'tree' ? 40 : (layer.type === 'pole' ? 20 : 30);
        for (let i = 0; i < count; i++) {
            objects.push({
                layer: layer,
                x: Math.random() * width * 2,
                y: Math.random() * height * 0.6 + height * 0.3,
                size: 30 + Math.random() * 100,
                offset: Math.random() * Math.PI * 2
            });
        }
    });
    animate();
}

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);

function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, COLORS.skyTop);
    grad.addColorStop(1, COLORS.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // Sunset/Twilight Glow
    const sunGrad = ctx.createRadialGradient(width * 0.8, height * 0.3, 0, width * 0.8, height * 0.3, width * 0.6);
    sunGrad.addColorStop(0, 'rgba(255, 158, 125, 0.4)');
    sunGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, width, height);
}

function drawMountains() {
    ctx.fillStyle = COLORS.mountain;
    ctx.beginPath();
    ctx.moveTo(0, height * 0.7);
    for (let i = 0; i <= width; i += 50) {
        const h = Math.sin(i * 0.01) * 50 + Math.cos(i * 0.005) * 80;
        ctx.lineTo(i, height * 0.7 - h);
    }
    ctx.lineTo(width, height * 0.7);
    ctx.fill();
}

function drawParallax() {
    layers.forEach(layer => {
        ctx.fillStyle = layer.color;
        objects.filter(o => o.layer === layer).forEach(obj => {
            // Move based on frame and speed
            obj.x -= layer.speed;
            if (obj.x < -obj.size) obj.x = width + obj.size;

            ctx.save();
            ctx.translate(obj.x, obj.y);
            
            if (layer.type === 'tree') {
                // Procedural Tree
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-obj.size/4, -obj.size);
                ctx.lineTo(obj.size/4, -obj.size);
                ctx.closePath();
                ctx.fill();
            } else if (layer.type === 'pole') {
                // Roadside Pole
                ctx.fillRect(-2, -obj.size * 0.8, 4, obj.size * 0.8);
                ctx.fillRect(-obj.size/3, -obj.size * 0.8, obj.size * 0.6, 5);
            } else {
                // Bushes / Roadside elements
                ctx.beginPath();
                ctx.arc(0, 0, obj.size/2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });
    });
}

function drawRoad() {
    // Road Surface
    const roadGrad = ctx.createLinearGradient(0, height * 0.75, 0, height);
    roadGrad.addColorStop(0, '#1a202c');
    roadGrad.addColorStop(1, '#2d3748');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, height * 0.75, width, height * 0.25);

    // Road Lines
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([40, 60]);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, height * 0.88);
    ctx.lineTo(width, height * 0.88);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawCar() {
    const carX = width / 2 - 150;
    const carY = height * 0.75 + Math.sin(frame * 0.1) * 2; // Subtle suspension bobbing
    const carW = 300;
    const carH = 80;

    ctx.save();
    ctx.translate(carX, carY);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(carW/2, carH + 10, carW/2, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // Car Body Shape (Sleek Sports Car)
    ctx.fillStyle = COLORS.carBody;
    ctx.beginPath();
    ctx.moveTo(0, carH - 30); // Front bumper
    ctx.bezierCurveTo(10, carH - 70, 80, carH - 90, 150, carH - 90); // Hood & Windshield
    ctx.bezierCurveTo(220, carH - 90, 300, carH - 60, 300, carH - 30); // Roof to Tail
    ctx.lineTo(300, carH - 10);
    ctx.lineTo(0, carH - 10);
    ctx.closePath();
    ctx.fill();

    // Windows / Cabin
    ctx.fillStyle = '#1a202c';
    ctx.beginPath();
    ctx.moveTo(90, carH - 75);
    ctx.lineTo(160, carH - 80);
    ctx.lineTo(220, carH - 40);
    ctx.lineTo(90, carH - 40);
    ctx.closePath();
    ctx.fill();

    // Headlight Glow
    const glow = ctx.createRadialGradient(15, carH - 35, 0, 15, carH - 35, 30);
    glow.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, carH - 60, 40, 40);

    // Wheels
    const wheelRotation = frame * 0.2;
    [70, 230].forEach(wx => {
        ctx.save();
        ctx.translate(wx, carH - 15);
        ctx.rotate(wheelRotation);
        
        // Tire
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fill();

        // Rims/Spokes
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 4;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(i * Math.PI * 2 / 5) * 25, Math.sin(i * Math.PI * 2 / 5) * 25);
            ctx.stroke();
        }
        ctx.restore();
    });

    ctx.restore();
}

function animate() {
    frame++;
    ctx.clearRect(0, 0, width, height);

    drawSky();
    drawMountains();
    drawParallax();
    drawRoad();
    drawCar();

    requestAnimationFrame(animate);
}

init();
</script>
</body>
</html>
