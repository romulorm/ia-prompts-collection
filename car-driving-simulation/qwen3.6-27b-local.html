<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Driving Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, roadY, carX, carY, scale;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    scale = Math.min(W / 1920, H / 1080);
    roadY = H * 0.72;
    carX = W * 0.3;
    carY = roadY;
  }
  resize();
  window.addEventListener('resize', resize);

  const time = { value: 0 };

  /* ---- Parallax scenery generation ---- */
  function seededRandom(seed) {
    let s = seed;
    return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
  }

  const sceneryLayers = [];

  /* Distant mountains */
  const mountainPoints = [];
  const rng0 = seededRandom(42);
  for (let i = 0; i < 60; i++) {
    mountainPoints.push({
      x: i * 200,
      h: 80 + rng0() * 160,
      w: 150 + rng0() * 200
    });
  }

  /* Mid-ground hills */
  const hillPoints = [];
  const rng1 = seededRandom(99);
  for (let i = 0; i < 80; i++) {
    hillPoints.push({
      x: i * 150,
      h: 40 + rng1() * 80,
      w: 100 + rng1() * 180
    });
  }

  /* Trees */
  const trees = [];
  const rng2 = seededRandom(77);
  for (let i = 0; i < 120; i++) {
    trees.push({
      x: i * 100 + rng2() * 60,
      type: rng2() > 0.5 ? 'pine' : 'round',
      h: 60 + rng2() * 100,
      w: 30 + rng2() * 50,
      side: rng2() > 0.5 ? 1 : -1
    });
  }

  /* Poles and signs */
  const poles = [];
  const rng3 = seededRandom(123);
  for (let i = 0; i < 60; i++) {
    poles.push({
      x: i * 200 + rng3() * 100,
      type: rng3() > 0.6 ? 'sign' : 'lamp'
    });
  }

  /* Roadside rocks/bushes */
  const roadside = [];
  const rng4 = seededRandom(200);
  for (let i = 0; i < 150; i++) {
    roadside.push({
      x: i * 70 + rng4() * 40,
      type: rng4() > 0.5 ? 'bush' : 'rock',
      size: 8 + rng4() * 20,
      side: rng4() > 0.5 ? 1 : -1
    });
  }

  /* Clouds */
  const clouds = [];
  const rng5 = seededRandom(555);
  for (let i = 0; i < 20; i++) {
    clouds.push({
      x: rng5() * 4000 - 500,
      y: 30 + rng5() * H * 0.35,
      w: 100 + rng5() * 250,
      h: 30 + rng5() * 50
    });
  }

  /* ---- Drawing helpers ---- */
  function lerpColor(a, b, t) {
    const ar = parseInt(a.slice(1, 3), 16), ag = parseInt(a.slice(3, 5), 16), ab = parseInt(a.slice(5, 7), 16);
    const br = parseInt(b.slice(1, 3), 16), bg = parseInt(b.slice(3, 5), 16), bb = parseInt(b.slice(5, 7), 16);
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
  }

  /* ---- Sky ---- */
  function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, roadY);
    grad.addColorStop(0, '#0a0e2a');
    grad.addColorStop(0.3, '#1a1a4a');
    grad.addColorStop(0.5, '#3d2b5a');
    grad.addColorStop(0.7, '#7a3a5a');
    grad.addColorStop(0.85, '#c45a3c');
    grad.addColorStop(1, '#e88a4a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, roadY);

    /* Sun glow */
    const sunX = W * 0.75;
    const sunY = roadY * 0.65;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 250 * scale);
    sunGrad.addColorStop(0, 'rgba(255,200,100,0.9)');
    sunGrad.addColorStop(0.2, 'rgba(255,160,60,0.5)');
    sunGrad.addColorStop(0.5, 'rgba(200,80,40,0.2)');
    sunGrad.addColorStop(1, 'rgba(100,40,30,0)');
    ctx.fillStyle = sunGrad;
    ctx.fillRect(0, 0, W, roadY);

    /* Sun disc */
    ctx.beginPath();
    ctx.arc(sunX, sunY, 35 * scale, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe4a0';
    ctx.fill();
  }

  /* ---- Clouds ---- */
  function drawClouds(offset) {
    ctx.globalAlpha = 0.3;
    for (const c of clouds) {
      const cx = ((c.x - offset * 0.08) % (W + 600)) - 300;
      ctx.fillStyle = '#5a4a6a';
      ctx.beginPath();
      ctx.ellipse(cx, c.y, c.w * scale, c.h * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx - c.w * 0.3 * scale, c.y + 5 * scale, c.w * 0.6 * scale, c.h * 0.7 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + c.w * 0.35 * scale, c.y + 3 * scale, c.w * 0.5 * scale, c.h * 0.6 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- Mountains ---- */
  function drawMountains(offset) {
    const scroll = offset * 0.05;
    ctx.fillStyle = '#2a1a3a';
    ctx.beginPath();
    ctx.moveTo(0, roadY);
    for (const m of mountainPoints) {
      const mx = m.x - scroll;
      const screenX = ((mx % (60 * 200)) + 60 * 200) % (60 * 200) - 200;
      ctx.lineTo(screenX, roadY - m.h * scale);
      ctx.lineTo(screenX + m.w * scale * 0.5, roadY);
    }
    ctx.lineTo(W, roadY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#1f1530';
    ctx.beginPath();
    ctx.moveTo(0, roadY);
    const scroll2 = offset * 0.07;
    for (const m of mountainPoints) {
      const mx = m.x * 0.8 - scroll2;
      const screenX = ((mx % (60 * 160)) + 60 * 160) % (60 * 160) - 200;
      ctx.lineTo(screenX, roadY - m.h * 0.6 * scale);
      ctx.lineTo(screenX + m.w * 0.4 * scale, roadY);
    }
    ctx.lineTo(W, roadY);
    ctx.closePath();
    ctx.fill();
  }

  /* ---- Hills ---- */
  function drawHills(offset) {
    const scroll = offset * 0.15;
    ctx.fillStyle = '#2d3a2a';
    ctx.beginPath();
    ctx.moveTo(0, roadY);
    for (const h of hillPoints) {
      const hx = h.x - scroll;
      const screenX = ((hx % (80 * 150)) + 80 * 150) % (80 * 150) - 200;
      ctx.lineTo(screenX, roadY - h.h * scale);
      ctx.lineTo(screenX + h.w * scale * 0.5, roadY);
    }
    ctx.lineTo(W, roadY);
    ctx.closePath();
    ctx.fill();
  }

  /* ---- Ground ---- */
  function drawGround() {
    const groundGrad = ctx.createLinearGradient(0, roadY, 0, H);
    groundGrad.addColorStop(0, '#3a3a2a');
    groundGrad.addColorStop(0.15, '#2a2a1a');
    groundGrad.addColorStop(1, '#1a1a0a');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, roadY, W, H - roadY);

    /* Road surface */
    const roadH = 55 * scale;
    const roadGrad = ctx.createLinearGradient(0, roadY, 0, roadY + roadH);
    roadGrad.addColorStop(0, '#4a4a4a');
    roadGrad.addColorStop(0.3, '#3d3d3d');
    roadGrad.addColorStop(1, '#2a2a2a');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, roadY, W, roadH);

    /* Road edge lines */
    ctx.strokeStyle = '#6a6a5a';
    ctx.lineWidth = 2 * scale;
    ctx.beginPath();
    ctx.moveTo(0, roadY + 2);
    ctx.lineTo(W, roadY + 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, roadY + roadH - 2);
    ctx.lineTo(W, roadY + roadH - 2);
    ctx.stroke();

    /* Dashed center line */
    ctx.strokeStyle = '#8a8a6a';
    ctx.lineWidth = 2 * scale;
    ctx.setLineDash([30 * scale, 25 * scale]);
    ctx.beginPath();
    ctx.moveTo(0, roadY + roadH / 2);
    ctx.lineTo(W, roadY + roadH / 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* ---- Scenery elements ---- */
  function drawTree(x, y, tree, flip) {
    const s = scale;
    const trunkW = 6 * s;
    const trunkH = tree.h * 0.4 * s;

    /* Trunk */
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

    if (tree.type === 'pine') {
      ctx.fillStyle = '#1a3a1a';
      ctx.beginPath();
      ctx.moveTo(x, y - tree.h * s);
      ctx.lineTo(x - tree.w * 0.5 * s, y - trunkH);
      ctx.lineTo(x + tree.w * 0.5 * s, y - trunkH);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y - tree.h * 0.85 * s);
      ctx.lineTo(x - tree.w * 0.4 * s, y - trunkH * 1.3);
      ctx.lineTo(x + tree.w * 0.4 * s, y - trunkH * 1.3);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#1a3a1a';
      ctx.beginPath();
      ctx.arc(x, y - tree.h * 0.75 * s, tree.w * 0.45 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#15301a';
      ctx.beginPath();
      ctx.arc(x - tree.w * 0.15 * s, y - tree.h * 0.65 * s, tree.w * 0.3 * s, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawScenery(offset) {
    const roadH = 55 * scale;

    /* Trees behind road */
    const treeScroll = offset * 0.5;
    for (const t of trees) {
      const tx = t.x - treeScroll;
      const screenX = ((tx % (120 * 100)) + 120 * 100) % (120 * 100) - 200;
      if (screenX > -100 && screenX < W + 100) {
        const ty = t.side > 0 ? roadY - 5 * scale : roadY + roadH + 5 * scale;
        drawTree(screenX, ty, t, false);
      }
    }

    /* Poles */
    const poleScroll = offset * 0.5;
    for (const p of poles) {
      const px = p.x - poleScroll;
      const screenX = ((px % (60 * 200)) + 60 * 200) % (60 * 200) - 200;
      if (screenX > -50 && screenX < W + 50) {
        const poleH = 80 * scale;
        ctx.fillStyle = '#5a5a5a';
        ctx.fillRect(screenX - 2 * scale, roadY - poleH, 4 * scale, poleH);

        if (p.type === 'lamp') {
          ctx.fillStyle = '#6a6a6a';
          ctx.beginPath();
          ctx.arc(screenX, roadY - poleH, 8 * scale, 0, Math.PI * 2);
          ctx.fill();
          /* Lamp glow */
          const lampGrad = ctx.createRadialGradient(screenX, roadY - poleH, 0, screenX, roadY - poleH, 30 * scale);
          lampGrad.addColorStop(0, 'rgba(255,220,150,0.4)');
          lampGrad.addColorStop(1, 'rgba(255,220,150,0)');
          ctx.fillStyle = lampGrad;
          ctx.beginPath();
          ctx.arc(screenX, roadY - poleH, 30 * scale, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#4a6a4a';
          ctx.fillRect(screenX - 15 * scale, roadY - poleH, 30 * scale, 20 * scale);
        }
      }
    }

    /* Roadside elements */
    const rsScroll = offset * 0.55;
    for (const r of roadside) {
      const rx = r.x - rsScroll;
      const screenX = ((rx % (150 * 70)) + 150 * 70) % (150 * 70) - 200;
      if (screenX > -50 && screenX < W + 50) {
        const ry = r.side > 0 ? roadY - 3 * scale : roadY + roadH + 3 * scale;
        if (r.type === 'bush') {
          ctx.fillStyle = '#2a4a2a';
          ctx.beginPath();
          ctx.ellipse(screenX, ry, r.size * scale, r.size * 0.6 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#5a5a4a';
          ctx.beginPath();
          ctx.ellipse(screenX, ry, r.size * 0.7 * scale, r.size * 0.5 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  /* ---- Car ---- */
  function drawCar(t) {
    const s = scale;
    const suspension = Math.sin(t * 3) * 2 * s + Math.sin(t * 1.7) * 1.5 * s;
    const cx = carX;
    const cy = carY - 50 * s + suspension;

    ctx.save();
    ctx.translate(cx, cy);

    /* Shadow */
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 50 * s - suspension, 90 * s, 12 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Car body */
    const bodyGrad = ctx.createLinearGradient(-80 * s, -40 * s, 80 * s, 20 * s);
    bodyGrad.addColorStop(0, '#2a2a3a');
    bodyGrad.addColorStop(0.3, '#3a3a4a');
    bodyGrad.addColorStop(0.7, '#2d2d3d');
    bodyGrad.addColorStop(1, '#1a1a2a');

    /* Main body shape */
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-80 * s, 10 * s);
    ctx.lineTo(-80 * s, -15 * s);
    ctx.lineTo(-65 * s, -15 * s);
    ctx.lineTo(-55 * s, -35 * s);
    ctx.lineTo(-20 * s, -50 * s);
    ctx.lineTo(30 * s, -50 * s);
    ctx.lineTo(55 * s, -35 * s);
    ctx.lineTo(70 * s, -20 * s);
    ctx.lineTo(80 * s, -15 * s);
    ctx.lineTo(80 * s, 10 * s);
    ctx.closePath();
    ctx.fill();

    /* Body outline */
    ctx.strokeStyle = '#4a4a5a';
    ctx.lineWidth = 1.5 * s;
    ctx.stroke();

    /* Windows */
    ctx.fillStyle = 'rgba(100,150,200,0.4)';
    ctx.beginPath();
    ctx.moveTo(-50 * s, -33 * s);
    ctx.lineTo(-22 * s, -47 * s);
    ctx.lineTo(2 * s, -47 * s);
    ctx.lineTo(2 * s, -33 * s);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(6 * s, -33 * s);
    ctx.lineTo(6 * s, -47 * s);
    ctx.lineTo(28 * s, -47 * s);
    ctx.lineTo(52 * s, -33 * s);
    ctx.closePath();
    ctx.fill();

    /* Window frames */
    ctx.strokeStyle = '#5a5a6a';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(-50 * s, -33 * s);
    ctx.lineTo(-22 * s, -47 * s);
    ctx.lineTo(2 * s, -47 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(6 * s, -33 * s);
    ctx.lineTo(6 * s, -47 * s);
    ctx.lineTo(28 * s, -47 * s);
    ctx.lineTo(52 * s, -33 * s);
    ctx.stroke();

    /* Headlights */
    ctx.fillStyle = '#ffe8a0';
    ctx.beginPath();
    ctx.ellipse(80 * s, -5 * s, 8 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Headlight beam */
    const beamGrad = ctx.createLinearGradient(80 * s, 0, 250 * s, 0);
    beamGrad.addColorStop(0, 'rgba(255,230,150,0.3)');
    beamGrad.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(85 * s, -10 * s);
    ctx.lineTo(250 * s, -30 * s);
    ctx.lineTo(250 * s, 25 * s);
    ctx.lineTo(85 * s, 5 * s);
    ctx.closePath();
    ctx.fill();

    /* Tail lights */
    ctx.fillStyle = '#ff3a2a';
    ctx.beginPath();
    ctx.ellipse(-80 * s, -5 * s, 5 * s, 4 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    /* Tail light glow */
    const tailGrad = ctx.createRadialGradient(-80 * s, -5 * s, 0, -80 * s, -5 * s, 20 * s);
    tailGrad.addColorStop(0, 'rgba(255,50,30,0.4)');
    tailGrad.addColorStop(1, 'rgba(255,50,30,0)');
    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    ctx.arc(-80 * s, -5 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();

    /* Door lines */
    ctx.strokeStyle = '#3a3a4a';
    ctx.lineWidth = 1 * s;
    ctx.beginPath();
    ctx.moveTo(-5 * s, -33 * s);
    ctx.lineTo(-5 * s, 10 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(35 * s, -33 * s);
    ctx.lineTo(35 * s, 10 * s);
    ctx.stroke();

    /* Door handle */
    ctx.fillStyle = '#6a6a7a';
    ctx.fillRect(2 * s, -15 * s, 10 * s, 3 * s);
    ctx.fillRect(42 * s, -15 * s, 10 * s, 3 * s);

    /* Side mirror */
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(-58 * s, -38 * s, 8 * s, 5 * s);

    /* Bumper */
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(-82 * s, 5 * s, 164 * s, 8 * s);
    ctx.fillRect(75 * s, -18 * s, 8 * s, 23 * s);
    ctx.fillRect(-83 * s, -18 * s, 8 * s, 23 * s);

    /* Lower body / rocker panel */
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(-75 * s, 5 * s, 150 * s, 5 * s);

    /* Wheels */
    const wheelRadius = 18 * s;
    const wheelY = 15 * s;
    const frontWheelX = 50 * s;
    const rearWheelX = -55 * s;
    const wheelRotation = t * 4;

    /* Front wheel */
    drawWheel(frontWheelX, wheelY, wheelRadius, wheelRotation, s);
    /* Rear wheel */
    drawWheel(rearWheelX, wheelY, wheelRadius, wheelRotation, s);

    /* Exhaust smoke */
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 5; i++) {
      const smokeX = -85 * s - i * 15 * s - Math.sin(t * 2 + i) * 5 * s;
      const smokeY = 5 * s - i * 8 * s + Math.sin(t * 1.5 + i) * 3 * s;
      const smokeR = (5 + i * 4) * s;
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath();
      ctx.arc(smokeX, smokeY, smokeR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawWheel(x, y, r, rotation, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    /* Tire */
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    /* Tire sidewall detail */
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 3 * s;
    ctx.beginPath();
    ctx.arc(0, 0, r - 2 * s, 0, Math.PI * 2);
    ctx.stroke();

    /* Rim */
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2);
    ctx.fill();

    /* Rim inner */
    ctx.fillStyle = '#6a6a6a';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2);
    ctx.fill();

    /* Spokes */
    ctx.strokeStyle = '#9a9a9a';
    ctx.lineWidth = 2.5 * s;
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(angle) * r * 0.58, Math.sin(angle) * r * 0.58);
      ctx.stroke();
    }

    /* Hub cap */
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2);
    ctx.fill();

    /* Bolts */
    ctx.fillStyle = '#777';
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2 + 0.3;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r * 0.3, Math.sin(angle) * r * 0.3, 1.5 * s, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  /* ---- Road texture / particles ---- */
  function drawRoadParticles(offset) {
    const roadH = 55 * scale;
    ctx.fillStyle = 'rgba(100,100,90,0.3)';
    const scroll = offset * 0.55;
    for (let i = 0; i < 40; i++) {
      const px = ((i * 53 + 17 - scroll * 0.8) % (W + 100)) - 50;
      const py = roadY + 5 + (i * 7 % (roadH - 10));
      ctx.fillRect(px, py, 3 * scale, 1.5 * scale);
    }
  }

  /* ---- Atmospheric haze ---- */
  function drawAtmosphere() {
    const hazeGrad = ctx.createLinearGradient(0, roadY - 80 * scale, 0, roadY + 20 * scale);
    hazeGrad.addColorStop(0, 'rgba(200,120,60,0)');
    hazeGrad.addColorStop(0.6, 'rgba(180,100,50,0.08)');
    hazeGrad.addColorStop(1, 'rgba(100,60,30,0.15)');
    ctx.fillStyle = hazeGrad;
    ctx.fillRect(0, roadY - 80 * scale, W, 100 * scale);
  }

  /* ---- Stars (twinkling) ---- */
  function drawStars(t) {
    const rng = seededRandom(999);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 50; i++) {
      const sx = rng() * W;
      const sy = rng() * roadY * 0.5;
      const sr = 0.5 + rng() * 1.5;
      const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.5 + i * 0.7));
      ctx.globalAlpha = twinkle * 0.6;
      ctx.beginPath();
      ctx.arc(sx, sy, sr * scale, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- Main loop ---- */
  let lastTime = 0;
  let scrollOffset = 0;

  function animate(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    time.value += dt;
    scrollOffset += dt * 200;

    ctx.clearRect(0, 0, W, H);

    drawSky();
    drawStars(time.value);
    drawClouds(scrollOffset);
    drawMountains(scrollOffset);
    drawHills(scrollOffset);
    drawGround();
    drawRoadParticles(scrollOffset);
    drawScenery(scrollOffset);
    drawCar(time.value);
    drawAtmosphere();

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
